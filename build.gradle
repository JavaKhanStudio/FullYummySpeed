// offscreen(task, when): windows nobody is meant to watch go to a headless display.
apply from: 'gradle/offscreen.gradle'

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "FullYummySpeed"
    }

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}

project(":desktop") {
    apply plugin: "java"

    // libGDX ships an LWJGL that does not know the JNI version of Java 24+: pin a newer one.
    configurations.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group == 'org.lwjgl') useVersion(lwjglVersion)
        }
    }

    dependencies {
        implementation project(":core")
        // LWJGL3: the LWJGL2 backend's natives need libjawt.so SUNWprivate_1.1, gone from every JDK >= 16.
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api 'org.apache.commons:commons-collections4:4.1'
        api 'org.apache.commons:commons-lang3:3.5'
        // parallax-0.1.jar (jks.tools2d.parallax, 2017)
        api fileTree(dir: 'jars', include: '*.jar')
    }
}

tasks.named('eclipse') {
    doLast { delete ".project" }
}
