apply plugin: "java"



sourceSets 
{
    main 
    {
        java 
        {
            srcDir 'src'            
        }
    }
}

eclipse.project {
    name = appName + "_desktop"
}

project.ext.mainClassName = "com.mygdx.game.desktop.StartGame_Desktop"
project.ext.assetsDir = file("../core/assets")


def gameJvmArgs = { JavaExec t ->
    // LWJGL and libGDX load native libraries; Java 24+ warns about that unless it is allowed.
    t.jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (JavaVersion.current() >= JavaVersion.VERSION_24) t.jvmArgs '--sun-misc-unsafe-memory-access=allow'
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) t.jvmArgs '-XstartOnFirstThread'
}

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    gameJvmArgs(it)
    // A board agent checking its work runs this too, and nobody is watching that window.
    rootProject.offscreen(it, 'unattended')
}

// The drawing editor (StartEditor_Desktop), 544x799.
tasks.register('runEditor', JavaExec) {
    dependsOn classes
    mainClass = 'com.mygdx.game.desktop.StartEditor_Desktop'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    gameJvmArgs(it)
    rootProject.offscreen(it, 'unattended')
}

tasks.register('debug', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
    gameJvmArgs(it)
    rootProject.offscreen(it, 'unattended')
}

// One runnable jar with every dependency and the assets: desktop/build/libs/desktop-1.0.jar
tasks.register('dist', Jar) {
    dependsOn classes, configurations.runtimeClasspath
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from files(project.assetsDir)
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': project.mainClassName, 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}


task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new groovy.xml.XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new groovy.xml.XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}