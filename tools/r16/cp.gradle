// r16: prints the desktop runtime classpath (one line) for tools/r16/run.sh.
allprojects { p ->
    p.afterEvaluate {
        if (p.name == 'desktop') p.tasks.register('r16Classpath') {
            def cp = p.sourceSets.main.runtimeClasspath
            dependsOn p.tasks.named('classes')
            doLast { println 'R16CP=' + cp.asPath }
        }
    }
}
