// r21: prints the desktop runtime classpath (one line) for tools/r21/run.sh.
allprojects { p ->
    p.afterEvaluate {
        if (p.name == 'desktop') p.tasks.register('r21Classpath') {
            def cp = p.sourceSets.main.runtimeClasspath
            dependsOn p.tasks.named('classes')
            doLast { println 'R21CP=' + cp.asPath }
        }
    }
}
